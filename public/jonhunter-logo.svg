<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" width="240" height="48" fill="none">
  <defs>
    <linearGradient id="jhGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5AA"/>
      <stop offset="50%" stop-color="#00C896"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="jhGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Background Container -->
  <rect x="4" y="4" width="40" height="40" rx="10" fill="#0A1210" stroke="#00C896" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Radar rings -->
  <circle cx="24" cy="24" r="14" stroke="url(#jhGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="24" cy="24" r="10" stroke="url(#jhGrad)" stroke-width="1.75" stroke-opacity="0.8"/>

  <!-- Crosshairs -->
  <line x1="24" y1="6" x2="24" y2="10" stroke="url(#jhGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="38" x2="24" y2="42" stroke="url(#jhGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="6" y1="24" x2="10" y2="24" stroke="url(#jhGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="24" x2="42" y2="24" stroke="url(#jhGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Target Core Diamond -->
  <path d="M24 15L29 24L24 33L19 24L24 15Z" fill="url(#jhGrad)" fill-opacity="0.2" stroke="url(#jhGrad)" stroke-width="1.75" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="3" fill="#00E5AA" filter="url(#jhGlow)"/>

  <!-- Brand Typography -->
  <text x="54" y="31" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Jon</text>
  <text x="94" y="31" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="url(#jhGrad)" letter-spacing="-0.5">Hunter</text>

  <!-- AI Badge -->
  <rect x="176" y="16" width="28" height="17" rx="5" fill="#00C896" fill-opacity="0.15" stroke="#00C896" stroke-width="1" stroke-opacity="0.4"/>
  <text x="190" y="28" font-family="JetBrains Mono, monospace, sans-serif" font-size="10" font-weight="800" fill="#00E5AA" text-anchor="middle">AI</text>
</svg>
