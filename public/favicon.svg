<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5AA"/>
      <stop offset="50%" stop-color="#00C896"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="48" height="48" rx="12" fill="#0A1210"/>
  <rect x="1" y="1" width="46" height="46" rx="11" stroke="#00C896" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Radar rings -->
  <circle cx="24" cy="24" r="15" stroke="url(#favGrad)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="3 3"/>
  <circle cx="24" cy="24" r="10" stroke="url(#favGrad)" stroke-width="2" stroke-opacity="0.9"/>

  <!-- Crosshairs -->
  <line x1="24" y1="4" x2="24" y2="9" stroke="url(#favGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="39" x2="24" y2="44" stroke="url(#favGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="4" y1="24" x2="9" y2="24" stroke="url(#favGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="39" y1="24" x2="44" y2="24" stroke="url(#favGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Target Core Diamond -->
  <path d="M24 14L30 24L24 34L18 24L24 14Z" fill="url(#favGrad)" fill-opacity="0.25" stroke="url(#favGrad)" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="3.5" fill="#00E5AA" filter="url(#favGlow)"/>
